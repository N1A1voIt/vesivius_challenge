# Vesuvius Challenge Configuration
# This file contains all hyperparameters and settings for training

# Data settings
data:
  data_dir: "data/raw"
  in_channels: 16          # Number of z-slices to use
  size: 256                # Patch size (height, width)
  train_split: 0.8         # Train/val split ratio
  
# Model settings
model:
  name: "unet3d"
  features: [32, 64, 128, 256]
  out_channels: 1
  use_attention: false

# Training settings
training:
  epochs: 20
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4
  
# Optimizer settings
optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  
# Scheduler settings  
scheduler:
  name: "cosine"
  T_max: 20
  eta_min: 0.000001

# Loss settings
loss:
  name: "bce_with_logits"
  pos_weight: 2.0          # Weight for positive class (ink)

# Early stopping
early_stopping:
  patience: 5
  min_delta: 0.001
  mode: "max"              # Maximize F0.5 score

# Augmentation settings
augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotate: true
  rotate_limit: 45
  brightness_contrast: true
  
# Experiment settings
experiment:
  seed: 42
  mixed_precision: true    # Use AMP for faster training
  gradient_accumulation: 1
  
# Logging
logging:
  log_interval: 10         # Log every N batches
  save_best_only: true
  
# Output
output:
  dir: "outputs"
  save_predictions: true
